<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Zing It{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'zing_it/css/style.css' %}">
  {% block css %}{% endblock %}
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="{% url 'home' %}" class="brand"><span class="brand-logo">♪</span> Zing It</a>
      <nav class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">Zing It · Soundtrack your life</footer>
</body>
</html>
